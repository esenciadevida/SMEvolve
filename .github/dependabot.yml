version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/Laravel-Website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "php"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      laravel:
        patterns:
          - "laravel/framework"
          - "laravel/*"

  - package-ecosystem: "npm"
    directory: "/Laravel-Website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
