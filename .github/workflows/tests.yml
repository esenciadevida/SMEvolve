name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: smevolve_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: smevolve_testing
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: array

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, fileinfo, intl, json, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('Laravel-Website/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: Laravel-Website

      - name: Copy environment file
        run: cp .env.example .env
        working-directory: Laravel-Website

      - name: Generate application key
        run: php artisan key:generate
        working-directory: Laravel-Website

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Laravel-Website/package-lock.json

      - name: Install NPM dependencies
        run: npm ci
        working-directory: Laravel-Website

      - name: Build frontend assets
        run: npm run build
        working-directory: Laravel-Website

      - name: Run database migrations
        run: php artisan migrate --force
        working-directory: Laravel-Website

      - name: Run tests
        run: php artisan test
        working-directory: Laravel-Website
